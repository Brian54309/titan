    <!-- Default/fallback tags. These are what non-JS crawlers (WhatsApp,

    <!-- Google Analytics 4. Replace G-XXXXXXXXXX with your real Measurement
         ID from analytics.google.com. Pageviews on route changes are sent
         manually via the AnalyticsTracker component (see src/components),
         since this is a client-side-routed SPA and gtag's automatic
         pageview only fires once on initial load. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view disabled here -- AnalyticsTracker sends it per route
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
